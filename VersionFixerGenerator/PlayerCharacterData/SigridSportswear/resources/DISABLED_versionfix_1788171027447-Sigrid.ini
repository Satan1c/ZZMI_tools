; Sigrid

; Constants -------------------------

[Constants]
global $active
global $first_run = 1

; Outfits
global persist $hat = 0

global persist $jacket = 0
global persist $underweartop = 0
global persist $croptop = 0

global persist $pants = 0
global persist $underwearbottom = 0
global persist $shoes = 0

; Misc
global persist $color = 0
global persist $blush = 0
global persist $nails = 0
global persist $pube = 0
global persist $wombtattoo = 1

global persist $sweat = 0
global persist $oiled = 0

; Extra
global persist $sigridtail = 0
global persist $sigridshield = 0

; Flat
global persist $currFlat = 0.25
global $rangeFlat
post $rangeFlat = $currFlat

global $menu = 0
global $page = 0
global $hold
global $holdShape
global $drag

global $navigating
global $navSpeed
global $hovering
global $slot
global $hoveredSlot
global $clickedSlot
global $selectedSlot = 0
global $targetSelectedSlot = 0
global $navDirection = -1

global persist $mx = 0.03
global persist $my = 0.15

global $ww
global $wh
global $cpx
global $cpy

global $dt
global $ts

[KeyShowMenu1]
condition = $active == 1
key = h
type = cycle
$menu = 0,1

[KeyShowMenu2]
condition = $active == 1
key = /
type = cycle
$menu = 0,1

[KeyMenu.ResetPosition]
condition = $menu == 1
key = no_ctrl shift VK_RIGHT
run = CommandListResetMenuPos

[KeyHold]
condition = $menu == 1 && $hovering == 0
key = no_ctrl no_shift VK_LBUTTON
key = no_ctrl no_shift VK_RBUTTON
type = hold
$hold = 1

[KeyHoldShape]
condition = $menu == 1 && $hovering > 1
key = no_ctrl no_shift VK_LBUTTON
key = no_ctrl no_shift VK_RBUTTON
type = hold
run = CommandListHoldShape

[CommandListHoldShape]
$holdShape = $hovering
post $holdShape = 0

[KeyClickedSlot]
condition = $hovering == 1 && $menu == 1
key = no_ctrl no_shift VK_LBUTTON
key = no_ctrl no_shift VK_RBUTTON
run = CommandListClickedSlot

[Present]
post $active = 0
if $active
	if $first_run
		ResourceSigridTopPosition = copy ResourceSigridTopPosition.Base
		ResourceSigridBottomPosition = copy ResourceSigridBottomPosition.Base
		run = CustomShaderComputeShapes.Top
		run = CustomShaderComputeShapes.Bottom
		$first_run = 0
	endif
	run = CustomShaderComputeShapes.Top
	run = CustomShaderComputeShapes.Bottom
	$dt = time - $ts
	$ts = time
	if $menu
		run = CommandListOutfitMenu
	endif
endif

[CustomShaderComputeShapes.Top]
cs = ../toggles/Shapes.hlsl
cs-u5 = copy ResourceSigridTopPosition.Base

; Flat
x88 = $currFlat
cs-t50 = copy ResourceSigridTopPosition.Base
cs-t51 = copy ResourceSigridTopPosition.Flat
ResourceSigridTopPosition = ref cs-u5
Dispatch = 91462, 1, 1

cs-u5 = null
cs-t50 = null
cs-t51 = null

[CustomShaderComputeShapes.Bottom]
cs = ../toggles/Shapes.hlsl
cs-u5 = copy ResourceSigridBottomPosition.Base

; Flat
x88 = $currFlat
cs-t50 = copy ResourceSigridBottomPosition.Base
cs-t51 = copy ResourceSigridBottomPosition.Flat
ResourceSigridBottomPosition = ref cs-u5
Dispatch = 134657, 1, 1

cs-u5 = null
cs-t50 = null
cs-t51 = null

; Custom Menu ==========================================

[CommandListDimensions]
if window_width != 0
	$ww = window_width
	$wh = window_height
elif $ww != 0
	$ww = rt_width
	$wh = rt_height
else
	$ww = res_width
	$wh = res_height
endif

if cursor_x != 0 && cursor_y != 0
	$cpx = cursor_x
	$cpy = cursor_y
elif cursor_window_x != 0 && cursor_window_y != 0
	$cpx = cursor_window_x / $ww
	$cpy = cursor_window_y / $wh
else
	$cpx = cursor_screen_x / $ww
	$cpy = cursor_screen_y / $wh
endif

[CommandListClickedSlot]
$clickedSlot = $hoveredSlot

if $clickedSlot == 1
	$hat = 1 - $hat
elif $clickedSlot == 2
	$jacket = 1 - $jacket
elif $clickedSlot == 3
	$underweartop = 1 - $underweartop
elif $clickedSlot == 4
	$croptop = 1 - $croptop
elif $clickedSlot == 5
	$pants = 1 - $pants
elif $clickedSlot == 6
	$underwearbottom = 1 - $underwearbottom
elif $clickedSlot == 7
	$shoes = 1 - $shoes
elif $clickedSlot == 8
	$color = $color + 1
	if $color > 1
		$color = 0
	endif
elif $clickedSlot == 9
	$blush = 1 - $blush
elif $clickedSlot == 10
	$nails = 1 - $nails
elif $clickedSlot == 11
	$pube = 1 - $pube
elif $clickedSlot == 12
	$wombtattoo = 1 - $wombtattoo
elif $clickedSlot == 13
	$sweat = 1 - $sweat
elif $clickedSlot == 14
	$oiled = 1 - $oiled
elif $clickedSlot == 15
	$sigridtail = 1 - $sigridtail
elif $clickedSlot == 16
	$sigridshield = 1 - $sigridshield
endif

[CommandListSlotItemImage]
x87 = 52 / $ww 
y87 = 52 / $wh
z87 = z87 + 3 / $ww
w87 = w87 + 6 / $ww
; ========================= SLOT 1 =========================
if $slot == 1
	ps-t100 = ResourceMenuItem.1
	if $hat == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 2 =========================
elif $slot == 2
	ps-t100 = ResourceMenuItem.2
	if $jacket == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 3 =========================
elif $slot == 3
	ps-t100 = ResourceMenuItem.3
	if $underweartop == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 4 =========================
elif $slot == 4
	ps-t100 = ResourceMenuItem.4
	if $croptop == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 5 =========================
elif $slot == 5
	ps-t100 = ResourceMenuItem.5
	if $pants == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 6 =========================
elif $slot == 6
	ps-t100 = ResourceMenuItem.6
	if $underwearbottom == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 7 =========================
elif $slot == 7
	ps-t100 = ResourceMenuItem.7
	if $shoes == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 8 =========================
elif $slot == 8
	ps-t100 = ResourceMenuItem.8
	run = CustomShaderElement

; ========================= SLOT 9 =========================
elif $slot == 9
	ps-t100 = ResourceMenuItem.9
	if $blush == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 10 =========================
elif $slot == 10
	ps-t100 = ResourceMenuItem.10
	if $nails == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif
	
; ========================= SLOT 11 =========================
elif $slot == 11
	ps-t100 = ResourceMenuItem.11
	if $pube == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 12 =========================
elif $slot == 12
	ps-t100 = ResourceMenuItem.12
	if $wombtattoo == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 13 =========================
elif $slot == 13
	ps-t100 = ResourceMenuItem.13
	if $sweat == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif

; ========================= SLOT 14 =========================
elif $slot == 14
	ps-t100 = ResourceMenuItem.14
	if $oiled == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif
	
; ========================= SLOT 15 =========================
elif $slot == 15
	ps-t100 = ResourceMenuItem.15
	if $sigridtail == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif
		
; ========================= SLOT 16 =========================
elif $slot == 16
	ps-t100 = ResourceMenuItem.16
	if $sigridshield == 0
		run = CustomShaderElement
	else
		run = CustomShaderDisabledElement
	endif
endif

x87 = 58 / $ww 
y87 = 58 / $wh
z87 = z87 - 3 / $ww
w87 = w87 - 6 / $ww

[CommandListOutfitMenu]
run = CommandListDimensions
run = CommandListBackground

[CommandListBackground]
local $cox
local $coy
ps-t100 = ResourceMenuBG
y87 = 600 / $wh
x87 = 360 / $ww
if $hovering == 0
	if $drag == 0
		if $cpx > $mx + 0.0125 && $cpx < ($mx+x87-0.0035) && $cpy > $my && $cpy < ($my+y87-0.0035)
			if $hold
				$cox = $cpx - $mx
				$coy = $cpy - $my
				$drag = 1
			endif
		endif
	else
		if $hold
			$mx = $cpx - $cox
			$my = $cpy - $coy
		else
			$drag = 0
		endif
	endif
endif
z87 = $mx
w87 = $my
run = CustomShaderElement
run = CommandListDrawToggles

[CommandListDrawToggles]
local $z0 = z87 + 15 / $ww
local $z1 = $z0 + (8 + 60) / $ww
local $z2 = $z0 + (8 + 60 + 8 + 60) / $ww
local $z3 = $z0 + (8 + 60 + 8 + 60 + 8 + 60) / $ww
local $z4 = $z0 + (8 + 60 + 8 + 60 + 8 + 60 + 8 + 60) / $ww
local $wo = (8 + 60) / $wh

local $sliderPaddingLeft = 212 / $ww

$hovering = 0
$slot = 0
x87 = 64 / $ww 
y87 = 64 / $wh

; Outfit
w87 = w87 + $wo + 34 / $ww
z87 = $z0
run = CommandListSlot

w87 = w87 + $wo
z87 = $z0
run = CommandListSlot
z87 = $z1
run = CommandListSlot
z87 = $z2
run = CommandListSlot

w87 = w87 + $wo
z87 = $z0
run = CommandListSlot
z87 = $z1
run = CommandListSlot
z87 = $z2
run = CommandListSlot

; Misc
w87 = w87 + $wo + 82 / $ww
z87 = $z0
run = CommandListSlot
z87 = $z1
run = CommandListSlot
z87 = $z2
run = CommandListSlot
z87 = $z3
run = CommandListSlot
z87 = $z4
run = CommandListSlot

w87 = w87 + $wo
z87 = $z0
run = CommandListSlot
z87 = $z1
run = CommandListSlot

z87 = $z2
x87 = 52 / $ww 
y87 = 52 / $wh
ps-t100 = ResourceMenuItem.Flat
run = CustomShaderElement
w87 = w87 + 27 / $wh
z87 = $z0 + $sliderPaddingLeft
run = CommandListDrawSlider.Flat

; Extra
w87 = w87 + $wo + 57 / $ww
z87 = $z0
run = CommandListSlot
z87 = $z1
run = CommandListSlot

[CommandListSlot]
$slot = $slot + 1
run = CommandListSlotItemImage
if $cpx > z87 && $cpx < (z87+x87-0.0035) && $cpy > w87 && $cpy < (w87+y87-0.0035)
	ps-t100 = ResourceItemSlotHover.2
	$hovering = 1
	$hoveredSlot = $slot
	$selectedSlot = 0
else
	if $slot == $selectedSlot // 1
		$hoveredSlot = $slot
		ps-t100 = ResourceItemSlotHover.2
	else
		ps-t100 = ResourceItemSlot
	endif
endif
run = CustomShaderElement
if $clickedSlot == $slot
	ps-t100 = ResourceItemSlotHover.1
	run = CustomShaderElement
	$clickedSlot = 0
endif

; Flat
[CommandListDrawSlider.Flat]
ps-t100 = ResourceSlider
x87 = 95 / $ww
y87 = 6 / $wh
run = CustomShaderElement
ps-t100 = ResourceSliderAfter
x87 = $currFlat * x87
run = CustomShaderElement
x87 = 95 / $ww
run = CommandListCursor.Flat

[CommandListInterpolateSpeed.Flat]
local $td = 0.033
local $ds = ($rangeFlat - $currFlat) / $td
$currFlat = $currFlat + $ds * $dt

[CommandListCursor.Flat]
local $x = z87
local $y = w87
local $xo = z87 + x87
local $yo = w87 + y87
if $cpx > $x && $cpx < $xo && $holdShape == 0
    if $cpy > $y - 15 / $wh && $cpy < $yo + 15 / $wh
        $hovering = 2
        $selectedSlot = 0
    endif
endif
if $holdShape == 2
  $rangeFlat = (($cpx-$x)/($xo-$x))
  if $rangeFlat < 0
    $rangeFlat = 0
  elif $rangeFlat > 1
    $rangeFlat = 1
  endif
endif
z87 = (z87 + x87 * ($currFlat) - 14 / $ww)
run = CommandListInterpolateSpeed.Flat
if $hovering == 2 || $selectedSlot == 1 || $holdShape == 2
  ps-t100 = ResourceButtonHover
else
  ps-t100 = ResourceButton
endif
x87 = 32 / $ww
y87 = 32 / $wh
w87 = w87 - 13 / $wh
run = CustomShaderElement

[CommandListResetMenuPos]
$mx = 50 / $ww
$my = 0.5 - 360 / $wh

[CustomShaderElement]
vs = ..\toggles\draw_2d.hlsl
ps = ..\toggles\draw_2d.hlsl
run = BuiltInCommandListUnbindAllRenderTargets
blend = ADD SRC_ALPHA INV_SRC_ALPHA
cull = none
topology = triangle_strip
o0 = set_viewport bb
Draw = 4,0

[CustomShaderDisabledElement]
vs = ..\toggles\draw_2d_disabled.hlsl
ps = ..\toggles\draw_2d_disabled.hlsl
run = BuiltInCommandListUnbindAllRenderTargets
blend = ADD SRC_ALPHA INV_SRC_ALPHA
cull = none
topology = triangle_strip
o0 = set_viewport bb
Draw = 4,0

