name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install UPX
        run: choco install upx -y

      - name: Build with Native AOT
        run: |
          dotnet publish VersionFixerGenerator/VersionFixerGenerator.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ./build/win-x64

      - name: Compress with UPX
        run: upx --best ./build/win-x64/VersionFixer.exe || echo "UPX failed, using uncompressed binary"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ./build/win-x64/VersionFixer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx

      - name: Build with Native AOT
        run: |
          dotnet publish VersionFixerGenerator/VersionFixerGenerator.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o ./build/linux-x64

      - name: Compress with UPX
        run: upx --best ./build/linux-x64/libVersionFixer.so || echo "UPX failed, using uncompressed binary"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ./build/linux-x64/libVersionFixer.so

  build-macos-intel:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install UPX
        run: brew install upx

      - name: Build for Intel (x64)
        run: |
          mkdir -p build/macos-x64/Contents/MacOS
          dotnet publish VersionFixerGenerator/VersionFixerGenerator.csproj \
            -c Release \
            -r osx-x64 \
            --self-contained true \
            -o ./build/macos-x64/Contents/MacOS

      - name: Compress with UPX
        run: upx --best ./build/macos-x64/Contents/MacOS/VersionFixer || echo "UPX failed, using uncompressed binary"

      - name: Create Info.plist for Intel
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > build/macos-x64/Contents/Info.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> build/macos-x64/Contents/Info.plist
          echo '<plist version="1.0">' >> build/macos-x64/Contents/Info.plist
          echo '<dict>' >> build/macos-x64/Contents/Info.plist
          echo '  <key>CFBundleName</key>' >> build/macos-x64/Contents/Info.plist
          echo '  <string>VersionFixer Intel</string>' >> build/macos-x64/Contents/Info.plist
          echo '  <key>LSMinimumSystemVersion</key>' >> build/macos-x64/Contents/Info.plist
          echo '  <string>10.13</string>' >> build/macos-x64/Contents/Info.plist
          echo '  <key>NSHighResolutionCapable</key>' >> build/macos-x64/Contents/Info.plist
          echo '  <true/>' >> build/macos-x64/Contents/Info.plist
          echo '</dict>' >> build/macos-x64/Contents/Info.plist
          echo '</plist>' >> build/macos-x64/Contents/Info.plist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ./build/macos-x64/VersionFixer.app

  build-macos-apple-silicon:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install UPX
        run: brew install upx

      - name: Build for Apple Silicon (arm64)
        run: |
          mkdir -p build/macos-arm64/Contents/MacOS
          dotnet publish VersionFixerGenerator/VersionFixerGenerator.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -o ./build/macos-arm64/Contents/MacOS

      - name: Compress with UPX
        run: upx --best ./build/macos-arm64/Contents/MacOS/VersionFixer || echo "UPX failed, using uncompressed binary"

      - name: Create Info.plist for Apple Silicon
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > build/macos-arm64/Contents/Info.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> build/macos-arm64/Contents/Info.plist
          echo '<plist version="1.0">' >> build/macos-arm64/Contents/Info.plist
          echo '<dict>' >> build/macos-arm64/Contents/Info.plist
          echo '  <key>CFBundleName</key>' >> build/macos-arm64/Contents/Info.plist
          echo '  <string>VersionFixer Apple Silicon</string>' >> build/macos-arm64/Contents/Info.plist
          echo '  <key>LSMinimumSystemVersion</key>' >> build/macos-arm64/Contents/Info.plist
          echo '  <string>10.13</string>' >> build/macos-arm64/Contents/Info.plist
          echo '  <key>NSHighResolutionCapable</key>' >> build/macos-arm64/Contents/Info.plist
          echo '  <true/>' >> build/macos-arm64/Contents/Info.plist
          echo '</dict>' >> build/macos-arm64/Contents/Info.plist
          echo '</plist>' >> build/macos-arm64/Contents/Info.plist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ./build/macos-arm64/VersionFixer.app

  generate-release-notes:
    needs: [build-windows, build-linux, build-macos-intel, build-macos-apple-silicon]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate release notes
        run: bash .github/workflows/generate-release-notes.sh

      - name: Upload Release Notes
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: RELEASE_NOTES.md
          tag_name: ${{ github.ref_name }}
