name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            rid: win-x64
            asset: VersionFixer-win-x64.exe

          - name: Linux x64
            runner: ubuntu-latest
            rid: linux-x64
            asset: VersionFixer-linux-x64

          - name: macOS Intel
            runner: macos-13
            rid: osx-x64
            asset: VersionFixer-macos-x64.zip

          - name: macOS Apple Silicon
            runner: macos-14
            rid: osx-arm64
            asset: VersionFixer-macos-arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build/publish

          dotnet publish VersionFixerGenerator/VersionFixerGenerator.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output build/publish

          find build/publish -maxdepth 1 -type f -print

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = 'build/publish/VersionFixerGenerator.exe'
          $dst = 'build/VersionFixer-win-x64.exe'

          if (-not (Test-Path $src)) {
            throw "Missing $src"
          }

          Copy-Item $src $dst

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          src='build/publish/VersionFixerGenerator'
          dst='build/VersionFixer-linux-x64'

          test -f "$src"

          cp "$src" "$dst"
          chmod +x "$dst"

          file "$dst"

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          src='build/publish/VersionFixerGenerator'
          app='build/VersionFixer.app'

          test -f "$src"

          mkdir -p "$app/Contents/MacOS"

          cp "$src" "$app/Contents/MacOS/VersionFixer"
          chmod +x "$app/Contents/MacOS/VersionFixer"

          cat > "$app/Contents/Info.plist" <<'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>CFBundleName</key>
  <string>VersionFixer</string>

  <key>CFBundleDisplayName</key>
  <string>VersionFixer</string>

  <key>CFBundleIdentifier</key>
  <string>com.satan1c.versionfixer</string>

  <key>CFBundleExecutable</key>
  <string>VersionFixer</string>

  <key>CFBundlePackageType</key>
  <string>APPL</string>

  <key>CFBundleVersion</key>
  <string>1.0</string>

  <key>CFBundleShortVersionString</key>
  <string>1.0</string>
</dict>
</plist>
PLIST

          if [[ '${{ matrix.rid }}' == 'osx-x64' ]]; then
            zip='build/VersionFixer-macos-x64.zip'
          else
            zip='build/VersionFixer-macos-arm64.zip'
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$app" \
            "$zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: bash .github/workflows/generate-release-notes.sh

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail

          test -f release-assets/VersionFixer-win-x64.exe
          test -f release-assets/VersionFixer-linux-x64
          test -f release-assets/VersionFixer-macos-x64.zip
          test -f release-assets/VersionFixer-macos-arm64.zip

          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
