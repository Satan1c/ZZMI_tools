name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            rid: win-x64
            source: build/publish/VersionFixerGenerator.exe
            asset: build/VersionFixer-win-x64.exe

          - name: Linux x64
            runner: ubuntu-latest
            rid: linux-x64
            source: build/publish/VersionFixerGenerator
            asset: build/VersionFixer-linux-x64

          - name: macOS Intel
            runner: macos-13
            rid: osx-x64
            source: build/publish/VersionFixerGenerator
            asset: build/VersionFixer-macos-x64

          - name: macOS Apple Silicon
            runner: macos-14
            rid: osx-arm64
            source: build/publish/VersionFixerGenerator
            asset: build/VersionFixer-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Publish Native AOT
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build/publish

          dotnet publish VersionFixerGenerator/VersionFixerGenerator.csproj \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output build/publish

          echo "Published files:"
          find build/publish -maxdepth 1 -type f -print

          test -f "${{ matrix.source }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item `
            "${{ matrix.source }}" `
            "${{ matrix.asset }}"

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          cp "${{ matrix.source }}" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

          file "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          bash .github/workflows/generate-release-notes.sh

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Release assets:"
          ls -lah release-assets

          test -f release-assets/VersionFixer-win-x64.exe
          test -f release-assets/VersionFixer-linux-x64
          test -f release-assets/VersionFixer-macos-x64
          test -f release-assets/VersionFixer-macos-arm64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
